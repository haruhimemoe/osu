name: Release

# Publishes to npm when a GitHub release is published. Uses npm trusted publishing (OIDC), so no
# token is stored: on npmjs.com, add this repo, release.yml and the environment "npm" as a trusted
# publisher first.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Trusted publishing needs npm 11.5.1 or later.
      - name: npm
        run: npm install -g npm@^11.5.1

      - name: Install
        run: bun install --frozen-lockfile

      - name: Tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: test "v$(node -p "require('./package.json').version")" = "$TAG"

      # A version with a prerelease part (a "-", e.g. 0.2.0-rc.1) publishes under the "next"
      # dist-tag, never "latest", whatever the GitHub release's prerelease checkbox says.
      - name: Publish
        run: |
          # A version already on npm (like a first release the owner published by hand) is done.
          NAME_VERSION="$(node -p "const p = require('./package.json'); p.name + '@' + p.version")"
          if npm view "$NAME_VERSION" version > /dev/null 2>&1; then
            echo "$NAME_VERSION is already on npm; nothing to publish."
            exit 0
          fi
          if node -p "require('./package.json').version" | grep -q -- -; then
            npm publish --provenance --access public --tag next
          else
            npm publish --provenance --access public
          fi
