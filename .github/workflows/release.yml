name: Release

# Publishes to npm when a GitHub release is published, using npm trusted publishing (OIDC), so no
# token is stored in this repo. Every action is pinned to a commit SHA, and npm to an exact
# version, because this job can publish.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # Trusted publishing needs npm 11.5.1 or later. Pinned exactly: this job can publish.
      - name: npm
        run: npm install -g npm@11.20.0

      - name: Install
        run: bun install --frozen-lockfile

      - name: Tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: test "v$(node -p "require('./package.json').version")" = "$TAG"

      # A version with a prerelease part (a "-", e.g. 0.2.0-rc.1) publishes under the "next"
      # dist-tag, never "latest", whatever the GitHub release's prerelease checkbox says.
      - name: Publish
        run: |
          # A version already on npm is done, but say so loudly: that version didn't come from
          # this workflow, so it has no provenance.
          NAME_VERSION="$(node -p "const p = require('./package.json'); p.name + '@' + p.version")"
          if npm view "$NAME_VERSION" version > /dev/null 2>&1; then
            echo "::warning title=Nothing published::$NAME_VERSION was already on npm, so this run published nothing and added no provenance."
            exit 0
          fi
          if node -p "require('./package.json').version" | grep -q -- -; then
            npm publish --provenance --access public --tag next
          else
            npm publish --provenance --access public
          fi
